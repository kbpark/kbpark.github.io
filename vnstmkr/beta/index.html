<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#14101d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>바이올리니스트 메이커</title>
  <link rel="stylesheet" href="css/style.css?v=5" />
</head>
<body>
  <div id="app">
    <div class="title-screen" id="title-screen">
      <div class="title-card">
        <div class="title-mark">🎻</div>
        <div class="title-logo"><span>바이올리니스트</span><span>메이커</span></div>
        <div class="title-sub">Sevzik Academy</div>
        <button class="title-start" id="title-start" type="button">게임시작</button>
        <div class="title-note" id="title-note">처음부터 시작합니다</div>
      </div>
    </div>

    <!-- 1) 상단 상태바 -->
    <header class="topbar">
      <div class="brand">
        <span class="logo"><span class="logo-mark">🎻</span><span class="logo-text">바이올리니스트 메이커</span></span>
      </div>
      <div class="top-right">
        <div class="wallet">
          <div class="amount">💰 <span id="points">0</span></div>
          <div class="rates">
            <span id="per-tap">탭당 +1</span>
            <span id="per-sec">초당 +0</span>
          </div>
        </div>
        <div class="sound-btns">
          <button class="snd-btn" id="bgm-btn" title="BGM">🎵</button>
          <button class="snd-btn" id="sfx-btn" title="효과음">🔊</button>
          <button class="snd-btn reset" id="reset-btn" title="처음부터 초기화">↺</button>
        </div>
      </div>
    </header>

    <!-- 사랑 게이지 -->
    <div class="affection hidden" id="affection">
      <span class="aff-face">💜</span>
      <span class="aff-name">사랑 게이지</span>
      <span class="aff-hearts" id="aff-hearts">🤍🤍🤍🤍🤍</span>
      <span class="aff-label" id="aff-label">음악 탐구</span>
    </div>

    <!-- 2) 현재 퀘스트 배너 -->
    <section class="quest">
      <div class="quest-head">
        <div class="quest-title" id="quest-title">Q1. 반짝반짝 작은별</div>
        <div class="quest-book"  id="quest-book">스즈키 1권</div>
      </div>
      <div class="quest-req" id="quest-req"></div>
      <button class="quest-btn" id="quest-btn" disabled>연습이 더 필요해요</button>
    </section>

    <!-- 3) 무대: 아카데미 배경 + 3인 캐릭터(안드레아·레온·바이올렛) -->
    <main class="stage" id="stage">
      <div class="stage-bg" id="stage-bg"></div>
      <div class="cast">
        <div class="cast-slot side" id="cast-andrea"></div>
        <div class="cast-slot center" id="cast-leon"></div>
        <div class="cast-slot side" id="cast-violet"></div>
      </div>
      <button class="encore-badge ready" id="encore-btn" title="감정 폭발">🎭</button>
      <div class="stage-hint" id="stage-hint">🎻 화면을 탭해 연습 · 🎭 아이콘을 탭해 감정 폭발</div>
    </main>

    <!-- 4) 조작부: 수동 탭 + 탭 패널(스킬/조력자/상점/업적) -->
    <footer class="controls">
      <div class="panel-bar">
        <div class="tabs" id="tabs">
          <button class="tab active" data-tab="skills">🎼 스킬</button>
          <button class="tab" data-tab="helpers">🤝 조력자</button>
          <button class="tab" data-tab="shop">🛒 상점</button>
          <button class="tab" data-tab="ach">🏆 업적</button>
          <button class="tab" data-tab="quest">🎻 퀘스트</button>
        </div>
        <button class="buymode-btn" id="buymode-btn">구매 x1</button>
      </div>
      <div class="panel" id="panel"></div>
    </footer>

    <!-- 미연시 대사창 -->
    <div class="dialogue" id="dialogue">
      <div class="cg-layer hidden" id="cg-layer"></div>   <!-- 대사 CG: 화면 전체 -->
      <div class="dialogue-portrait hidden" id="dialogue-portrait"></div>
      <div class="dialogue-box">
        <p class="dlg-line">
          <span class="dlg-name" id="dlg-name"></span><span class="dlg-text" id="dlg-text"></span>
        </p>
        <div class="dlg-choices" id="dlg-choices"></div>
        <div class="dlg-next" id="dlg-next"></div>
      </div>
    </div>

    <!-- 엔딩 CG 오버레이 -->
    <div class="ending" id="ending">
      <div class="cg" id="cg"></div>
      <div class="ending-box">
        <p class="dlg-line">
          <span class="dlg-name" id="ending-name"></span><span class="dlg-text" id="ending-text"></span>
        </p>
        <button class="restart-btn hidden" id="ending-restart">↻ 처음부터 다시 연주하기</button>
        <div class="dlg-next ending-next"></div>
      </div>
    </div>

    <!-- 토스트 알림 (업적/오프라인/업그레이드) -->
    <div class="toast-layer" id="toast-layer"></div>

  </div>

  <!-- 로드 순서: data → state → portraits → audio → ui → game -->
  <script src="js/data.js?v=5"></script>
  <script src="js/state.js?v=5"></script>
  <script src="js/portraits.js?v=5"></script>
  <script src="js/audio.js?v=5"></script>
  <script src="js/ui.js?v=5"></script>
  <script src="js/game.js?v=5"></script>
</body>
</html>
